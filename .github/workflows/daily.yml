name: daily run

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (5:17 am Central)
    - cron: "43 16 * * *"   # backup at 16:43 UTC (10:43 am Central), in case GitHub skips the first;
                            # a second run on the same day just replaces that day's files
  workflow_dispatch:         # lets you start a run by hand from the Actions tab

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch sources, build history, write status, open issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m jobwatcher.run

      - name: Commit the data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git pull --rebase
          git push

      - name: Collect the site files
        run: bash scripts/make_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
