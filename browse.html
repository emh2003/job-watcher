<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse · Job Watcher</title>
<meta name="description" content="A daily watch on financial analyst and FP&amp;A openings.">
<meta name="theme-color" content="#14140f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>try { var t = localStorage.getItem("job-watcher-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body data-page="browse">
<main>
  <h1>Browse</h1>
  <p class="sub">Open postings at the watched employers. Star a posting to keep it on your shortlist.</p>
  <section class="card">
    <div class="filters">
      <label>Show
        <span class="switch" id="f-role" role="group" aria-label="Which postings">
          <button type="button" data-role="role" aria-pressed="true">My role</button>
          <button type="button" data-role="all" aria-pressed="false">All postings</button>
        </span>
      </label>
      <label>Search titles <input type="search" id="f-q" placeholder="e.g. senior, treasury"></label>
      <label>Employer <select id="f-employer"></select></label>
      <label>Location <select id="f-location"></select></label>
      <label>Days open
        <select id="f-days">
          <option value="">Any</option><option value="0-3">0 to 3 days</option><option value="4-7">4 to 7 days</option>
          <option value="8-14">8 to 14 days</option><option value="15+">15 days or more</option>
        </select>
      </label>
      <label>Sort by first seen
        <select id="f-sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select>
      </label>
      <label style="display:flex;grid-auto-flow:column;align-items:center;gap:.35rem"><input type="checkbox" id="f-saved"> Shortlist only</label>
    </div>
  </section>
  <p class="muted small" id="count" aria-live="polite"></p>
  <section class="card" id="list"></section>
</main>
<script src="app.js"></script>
</body>
</html>
